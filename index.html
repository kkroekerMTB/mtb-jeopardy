<!doctype html>
<html lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="data:,">
  <title>Standup Jeopardy</title>
  <script src="telemetry-config.js"></script>
  <script src="node_modules/@microsoft/applicationinsights-web/browser/es5/ai.3.gbl.min.js"></script>
  <script src="telemetry.js"></script>
  <style>
    :root {
      --board-blue: #071f8f;
      --board-blue-dark: #03145f;
      --tile-border: #05091d;
      --jeopardy-gold: #f2c94c;
      --text-light: #fff8dc;
      --correct: #178a45;
      --missed: #a52525;
      --panel: #10142a;
      --panel-soft: #1b2140;
    }

    * {
      box-sizing: border-box;
    }

    [hidden] {
      display: none !important;
    }

    body {
      min-width: 980px;
      min-height: 100vh;
      margin: 0;
      background: #090b18;
      color: var(--text-light);
      font-family: Arial, Helvetica, sans-serif;
    }

    body.overlay-open {
      overflow: hidden;
    }

    button,
    a {
      font: inherit;
    }

    .app {
      min-height: 100vh;
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 14px;
    }

    .header {
      display: grid;
      grid-template-columns: 1fr auto;
      align-items: end;
      gap: 18px;
      padding: 12px 14px;
      background: var(--panel);
      border: 1px solid #2b3154;
    }

    .title-row {
      display: flex;
      align-items: baseline;
      gap: 14px;
      flex-wrap: wrap;
    }

    h1 {
      margin: 0;
      font-size: 30px;
      line-height: 1;
      letter-spacing: 0;
    }

    .episode-meta {
      min-height: 18px;
      color: #c9cfeb;
      font-size: 14px;
    }

    .team-controls {
      margin-top: 8px;
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .team-name {
      display: flex;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .team-name label {
      font-size: 14px;
      color: #c9cfeb;
    }

    .team-name input {
      min-width: 180px;
      max-width: 320px;
      width: 100%;
      padding: 10px 12px;
      border: 1px solid #333b66;
      border-radius: 8px;
      background: var(--panel-soft);
      color: #fff;
    }

    .team-name input::placeholder {
      color: #8f99c4;
    }

    .music-setting {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 38px;
      margin-top: 26px;
      padding: 8px 12px;
      border: 1px solid #333b66;
      border-radius: 8px;
      background: var(--panel-soft);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    .music-setting input {
      width: 18px;
      height: 18px;
      margin: 0;
      accent-color: var(--jeopardy-gold);
      cursor: pointer;
    }

    .toolbar-button,
    .filter-button {
      margin-top: 26px;
      padding: 10px 16px;
      border: 1px solid #333b66;
      border-radius: 8px;
      background: var(--panel-soft);
      color: #fff;
      cursor: pointer;
      font-size: 14px;
      font-weight: 700;
    }

    .toolbar-button:hover,
    .filter-button:hover {
      filter: brightness(1.08);
    }

    .filter-button.active {
      background: var(--jeopardy-gold);
      color: #03145f;
      border-color: #f7d760;
    }

    .leaderboard-card {
      position: relative;
      width: min(960px, 92vw);
      min-height: min(580px, 80vh);
      padding: 32px;
      display: flex;
      flex-direction: column;
      gap: 22px;
      background: var(--board-blue);
      border: 4px solid #05091d;
      color: #fff;
      overflow: hidden;
    }

    .leaderboard-controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
    }

    .leaderboard-summary {
      font-size: 14px;
      color: #c9cfeb;
    }

    .leaderboard-table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    .leaderboard-table th,
    .leaderboard-table td {
      padding: 14px 12px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.12);
      text-align: left;
    }

    .leaderboard-table th {
      color: #c9cfeb;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      font-size: 12px;
    }

    .leaderboard-table tbody tr:hover {
      background: rgba(255, 255, 255, 0.06);
    }

    .leaderboard-empty {
      padding: 24px;
      background: rgba(255, 255, 255, 0.05);
      border-radius: 12px;
      color: #c9cfeb;
    }

    .leaderboard-overlay .close-button {
      right: 20px;
      top: 20px;
    }

    .leaderboard-overlay h2 {
      margin: 0;
      font-size: 34px;
      letter-spacing: 0.02em;
    }

    .leaderboard-overlay .leaderboard-card {
      max-height: calc(100vh - 80px);
      overflow: auto;
    }

    .confirmation-card {
      width: min(520px, 92vw);
      padding: 28px;
      background: var(--panel);
      border: 2px solid #333b66;
      color: #fff;
    }

    .confirmation-card h2 {
      margin: 0 0 12px;
      font-size: 28px;
    }

    .confirmation-card p {
      margin: 0 0 14px;
      color: #c9cfeb;
      line-height: 1.4;
    }

    .confirmation-summary {
      margin: 16px 0;
      padding: 14px;
      background: var(--panel-soft);
      border: 1px solid #333b66;
      color: #fff;
      font-weight: 700;
    }

    .confirmation-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 20px;
    }

    .confirmation-status {
      min-height: 20px;
      color: #f7d760;
      font-size: 14px;
    }

    .confirmation-button {
      padding: 10px 16px;
      border: 1px solid #333b66;
      background: var(--panel-soft);
      color: #fff;
      cursor: pointer;
      font-weight: 700;
    }

    .confirmation-button.primary {
      background: var(--jeopardy-gold);
      color: #03145f;
      border-color: #f7d760;
    }

    .confirmation-button:disabled {
      opacity: 0.58;
      cursor: default;
    }

    .source-link {
      color: #f7d760;
      font-size: 14px;
      text-decoration: none;
    }

    .source-link:hover {
      text-decoration: underline;
    }

    .score-panel {
      display: flex;
      align-items: end;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .submit-score-button {
      margin-top: 0;
      min-width: 124px;
    }

    .submit-score-button:disabled {
      opacity: 0.58;
      cursor: default;
      filter: none;
    }

    .stats {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      flex-wrap: wrap;
    }

    .stat {
      min-width: 110px;
      padding: 8px 10px;
      background: var(--panel-soft);
      border: 1px solid #333b66;
      text-align: center;
    }

    .stat-label {
      display: block;
      margin-bottom: 2px;
      color: #c9cfeb;
      font-size: 11px;
      text-transform: uppercase;
    }

    .stat-value {
      color: #fff;
      font-size: 20px;
      font-weight: 700;
    }

    .status {
      flex: 1;
      min-height: 58vh;
      display: grid;
      place-items: center;
      padding: 40px;
      background: var(--board-blue-dark);
      border: 2px solid #20264a;
      text-align: center;
    }

    .status-title {
      margin: 0 0 14px;
      font-size: 28px;
      font-weight: 700;
    }

    .loader {
      width: 42px;
      height: 42px;
      margin: 0 auto 16px;
      border: 5px solid rgba(255, 255, 255, 0.22);
      border-top-color: var(--jeopardy-gold);
      border-radius: 50%;
      animation: spin 0.9s linear infinite;
    }

    @keyframes spin {
      to {
        transform: rotate(360deg);
      }
    }

    .board {
      display: grid;
      grid-template-columns: repeat(var(--category-count), minmax(132px, 1fr));
      grid-auto-rows: minmax(96px, 1fr);
      flex: 1;
      min-height: 640px;
      border: 3px solid var(--tile-border);
      background: var(--tile-border);
      gap: 3px;
    }

    .category,
    .tile {
      display: grid;
      place-items: center;
      min-width: 0;
      padding: 10px;
      border: 0;
      text-align: center;
    }

    .category {
      background: var(--board-blue-dark);
      color: #fff;
      font-size: clamp(15px, 1.2vw, 22px);
      font-weight: 800;
      line-height: 1.12;
      text-transform: uppercase;
    }

    .tile {
      position: relative;
      background: var(--board-blue);
      color: var(--jeopardy-gold);
      font-size: clamp(30px, 3.8vw, 58px);
      font-weight: 900;
      line-height: 1;
      cursor: pointer;
      text-shadow: 2px 2px 0 #05091d;
    }

    .tile:not(:disabled):hover {
      background: #0a28b8;
    }

    .tile:disabled {
      cursor: default;
    }

    .tile.unavailable {
      background: #1d2444;
      color: #aeb4cf;
      font-size: 30px;
      text-shadow: none;
    }

    .tile.used {
      opacity: 0.68;
      color: rgba(242, 201, 76, 0.72);
      text-shadow: none;
    }

    .tile.used::after {
      content: "";
      position: absolute;
      right: 10px;
      bottom: 10px;
      width: 18px;
      height: 18px;
      border-radius: 50%;
      background: var(--outcome-color);
      box-shadow: 0 0 0 2px rgba(255, 255, 255, 0.7);
    }

    .tile.daily-double-used {
      background: var(--missed);
      color: #fff;
      font-size: clamp(20px, 2.2vw, 34px);
      white-space: pre-line;
    }

    .overlay {
      position: fixed;
      inset: 0;
      z-index: 20;
      display: none;
      padding: 24px;
      background: rgba(2, 4, 18, 0.94);
    }

    .overlay.animating,
    .overlay.closing,
    .overlay.daily-double-entering {
      transition: background 260ms ease;
    }

    .overlay.animating {
      background: rgba(2, 4, 18, 0);
    }

    .overlay.closing {
      background: rgba(2, 4, 18, 0);
    }

    .overlay.daily-double-entering {
      background: rgba(2, 4, 18, 0);
      perspective: 1400px;
    }

    .overlay.active {
      display: grid;
      place-items: center;
    }

    .clue-card {
      position: relative;
      width: min(1120px, 96vw);
      min-height: min(700px, 88vh);
      padding: 58px;
      display: flex;
      flex-direction: column;
      justify-content: center;
      gap: 28px;
      background: var(--board-blue);
      border: 4px solid #05091d;
      text-align: center;
      cursor: pointer;
      transform-origin: top left;
    }

    .clue-card.daily-double {
      background: #a52525;
    }

    .clue-card.wagering .clue-value,
    .clue-card.wagering .clue-text,
    .clue-card.wagering .response,
    .clue-card.wagering .score-actions {
      display: none;
    }

    .wager-panel {
      width: min(620px, 90%);
      margin: 0 auto;
      padding: 36px;
      border: 2px solid rgba(255, 255, 255, 0.72);
      background: rgba(0, 0, 0, 0.18);
      cursor: default;
    }

    .wager-panel h2 {
      margin: 0 0 24px;
      color: #fff;
      font-size: clamp(42px, 6vw, 76px);
      text-transform: uppercase;
    }

    .wager-guidance {
      margin: 8px 0;
      color: #fff8dc;
      font-size: 20px;
      font-weight: 700;
    }

    .wager-field {
      display: grid;
      gap: 10px;
      margin-top: 26px;
      text-align: left;
    }

    .wager-field label {
      font-size: 18px;
      font-weight: 800;
    }

    .wager-field input {
      width: 100%;
      padding: 16px;
      border: 2px solid #fff;
      background: #fff;
      color: #10142a;
      font-size: 28px;
      font-weight: 800;
    }

    .wager-submit {
      width: 100%;
      margin-top: 18px;
      padding: 16px 20px;
      border: 2px solid #fff;
      background: var(--jeopardy-gold);
      color: #03145f;
      cursor: pointer;
      font-size: 22px;
      font-weight: 900;
    }

    .wager-error {
      min-height: 22px;
      margin: 10px 0 0;
      color: #fff;
      font-weight: 700;
    }

    .overlay.animating .clue-card {
      transition: transform 260ms cubic-bezier(0.2, 0.8, 0.2, 1);
    }

    .overlay.closing .clue-card {
      transition: transform 240ms cubic-bezier(0.4, 0, 0.9, 0.2);
    }

    .close-button {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(255, 255, 255, 0.6);
      background: rgba(0, 0, 0, 0.22);
      color: #fff;
      font-size: 28px;
      line-height: 1;
      cursor: pointer;
    }

    .close-button:hover {
      background: rgba(255, 255, 255, 0.16);
    }

    .clue-value {
      color: var(--jeopardy-gold);
      font-size: 30px;
      font-weight: 900;
    }

    .clue-category {
      margin: 0;
      color: #fff;
      font-size: clamp(22px, 2.5vw, 36px);
      font-weight: 800;
      line-height: 1.12;
      text-transform: uppercase;
    }

    .true-daily-double {
      margin-bottom: 10px;
      color: #fff;
      font-size: clamp(28px, 3vw, 44px);
      text-transform: uppercase;
    }

    .clue-text {
      margin: 0;
      color: #fff;
      font-size: clamp(34px, 4.2vw, 64px);
      font-weight: 800;
      line-height: 1.14;
    }

    .response {
      display: block;
      margin: 0;
      padding-top: 28px;
      border-top: 2px solid rgba(255, 255, 255, 0.32);
      color: var(--jeopardy-gold);
      font-size: clamp(28px, 3.2vw, 48px);
      font-weight: 800;
      line-height: 1.16;
      align-self: center;
      opacity: 0;
      transform: translateY(10px);
      visibility: hidden;
    }

    .clue-card.revealed {
      cursor: default;
    }

    .clue-card.revealed .response {
      opacity: 1;
      transform: translateY(0);
      visibility: visible;
      transition: opacity 220ms ease, transform 220ms ease;
    }

    .clue-card.revealed .score-actions {
      display: flex;
    }

    .score-actions {
      display: none;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .score-button {
      min-width: 180px;
      padding: 18px 24px;
      border: 2px solid rgba(255, 255, 255, 0.72);
      color: #fff;
      font-size: 24px;
      font-weight: 800;
      cursor: pointer;
    }

    .score-button.correct {
      background: var(--correct);
    }

    .score-button.missed {
      background: var(--missed);
    }

    .score-button:hover {
      filter: brightness(1.1);
    }

    #overlayValue {
      border-bottom: solid var(--jeopardy-gold) 2px;
    }

    @media (max-width: 1120px) {
      body {
        min-width: 760px;
      }

      .app {
        padding: 10px;
      }

      .header {
        grid-template-columns: 1fr;
        align-items: start;
      }

      .stats {
        justify-content: flex-start;
      }

      .score-panel {
        justify-content: flex-start;
      }

      .board {
        grid-auto-rows: minmax(82px, 1fr);
        min-height: 560px;
      }

      .tile {
        font-size: 34px;
      }

      .clue-card {
        min-height: 82vh;
        padding: 44px 34px;
      }
    }
  </style>
</head>

<body>
  <main class="app">
    <header class="header">
      <div>
        <div class="title-row">
          <h1>Standup Jeopardy</h1>
          <a id="sourceLink" class="source-link" href="#" target="_blank" rel="noopener" hidden>Source episode</a>
        </div>
        <div id="episodeMeta" class="episode-meta"></div>
        <div class="team-controls">
          <div class="team-name">
            <label for="teamName">Team name</label>
            <input id="teamName" name="teamName" type="text" placeholder="Enter team name" />
          </div>
          <button id="openLeaderboard" class="toolbar-button" type="button">Leaderboard</button>
          <label class="music-setting" for="themeMusicEnabled">
            <input id="themeMusicEnabled" name="themeMusicEnabled" type="checkbox" />
            Theme music
          </label>
        </div>
      </div>
      <div class="score-panel">
        <button id="submitScore" class="toolbar-button submit-score-button" type="button">Submit score</button>
        <div class="stats" aria-label="Team tally">
          <div class="stat">
            <span class="stat-label">Correct</span>
            <span id="correctCount" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Missed</span>
            <span id="missedCount" class="stat-value">0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Net</span>
            <span id="netValue" class="stat-value">$0</span>
          </div>
          <div class="stat">
            <span class="stat-label">Unavailable</span>
            <span id="unavailableCount" class="stat-value">0</span>
          </div>
        </div>
      </div>
    </header>

    <section id="status" class="status" aria-live="polite">
      <div>
        <div class="loader" aria-hidden="true"></div>
        <p id="statusTitle" class="status-title">Loading board...</p>
      </div>
    </section>

    <section id="board" class="board" aria-label="Jeopardy board" hidden></section>
  </main>

  <section id="leaderboardOverlay" class="overlay leaderboard-overlay" aria-modal="true" role="dialog"
    aria-label="Leaderboard" hidden>
    <article class="leaderboard-card">
      <button id="closeLeaderboard" class="close-button" type="button" aria-label="Close leaderboard">&times;</button>
      <h2>Leaderboard</h2>
      <div id="leaderboardFilters" class="leaderboard-controls" role="tablist" aria-label="Score filters"></div>
      <div id="leaderboardSummary" class="leaderboard-summary"></div>
      <table class="leaderboard-table">
        <thead>
          <tr>
            <th scope="col">Team</th>
            <th scope="col">Score</th>
            <th scope="col">DD Amount</th>
            <th scope="col">Correct</th>
            <th scope="col">Missed</th>
            <th scope="col">Games</th>
          </tr>
        </thead>
        <tbody id="leaderboardBody"></tbody>
      </table>
      <div id="leaderboardEmpty" class="leaderboard-empty" hidden>No scores are available for this filter.</div>
    </article>
  </section>

  <section id="submitScoreOverlay" class="overlay" aria-modal="true" role="dialog" aria-label="Submit score" hidden>
    <article class="confirmation-card">
      <h2>Submit score?</h2>
      <p>This records the current team score on the leaderboard.</p>
      <div id="submitScoreSummary" class="confirmation-summary"></div>
      <div id="submitScoreStatus" class="confirmation-status" aria-live="polite"></div>
      <div class="confirmation-actions">
        <button id="cancelSubmitScore" class="confirmation-button" type="button">Cancel</button>
        <button id="confirmSubmitScore" class="confirmation-button primary" type="button">Submit</button>
      </div>
    </article>
  </section>

  <section id="overlay" class="overlay" aria-modal="true" role="dialog" hidden>
    <article id="clueCard" class="clue-card">
      <button id="closeClue" class="close-button" type="button" aria-label="Close clue">&times;</button>
      <p id="overlayCategory" class="clue-category"></p>
      <section id="wagerPanel" class="wager-panel" hidden>
        <h2>Daily Double</h2>
        <p id="wagerCurrentScore" class="wager-guidance"></p>
        <p id="wagerRange" class="wager-guidance"></p>
        <div class="wager-field">
          <label for="dailyDoubleWager">Wager</label>
          <input id="dailyDoubleWager" name="dailyDoubleWager" type="number" step="1" inputmode="numeric" />
        </div>
        <button id="lockWager" class="wager-submit" type="button">Lock wager</button>
        <p id="wagerError" class="wager-error" aria-live="polite"></p>
      </section>
      <div class="clue-value">
        <div id="trueDailyDouble" class="true-daily-double" hidden>True Daily Double!</div>
        <span id="overlayValue"></span>
      </div>
      <p id="overlayClue" class="clue-text"></p>
      <p id="overlayResponse" class="response"></p>
      <div class="score-actions" aria-label="Mark clue result">
        <button id="markCorrect" class="score-button correct" type="button">Correct</button>
        <button id="markMissed" class="score-button missed" type="button">Missed</button>
      </div>
    </article>
  </section>

  <audio
    id="dailyDoubleSound"
    src="media/jeopardy-daily-double-sound-effect-from-youtube_76mCCAq.mp3"
    preload="auto"
  ></audio>
  <audio id="themeMusic" src="media/Jeopardy-theme-song.mp3" preload="auto"></audio>

  <script>
    const TEAM_NAME_KEY = "standup-jeopardy-team-name";
    const THEME_MUSIC_ENABLED_KEY = "standup-jeopardy-theme-music-enabled";
    const GAME_DATA_URL = "data/latest-game.json";
    const GAME_RULES_URL = "data/game-rules.json";
    const LEADERBOARD_API_URL = "https://app-mtb-jeopardy-ftdbbcefh2dqd9d0.canadaeast-01.azurewebsites.net/api/scores";
    const SUBMIT_SCORE_API_URL = LEADERBOARD_API_URL;

    const LEADERBOARD_FILTERS = [
      { id: "today", label: "Today" },
      { id: "this-week", label: "This week" },
      { id: "all-time", label: "All time" }
    ];

    const state = {
      board: null,
      selectedClueId: null,
      revealed: false,
      selectedTileRect: null,
      isTransitioning: false,
      leaderboardFilter: "today",
      scoreSubmitted: false,
      scoreSubmitting: false,
      dailyDoubleWager: 0,
      dailyDoubleScoreBeforeWager: 0,
      wagerLocked: false,
      themeMusicRetryPending: false,
      answeredClueIds: [],
      maxSubmittedQuestions: null,
      gameRulesUnavailable: false
    };

    const els = {
      status: document.getElementById("status"),
      statusTitle: document.getElementById("statusTitle"),
      board: document.getElementById("board"),
      episodeMeta: document.getElementById("episodeMeta"),
      sourceLink: document.getElementById("sourceLink"),
      correctCount: document.getElementById("correctCount"),
      missedCount: document.getElementById("missedCount"),
      netValue: document.getElementById("netValue"),
      unavailableCount: document.getElementById("unavailableCount"),
      submitScore: document.getElementById("submitScore"),
      submitScoreOverlay: document.getElementById("submitScoreOverlay"),
      submitScoreSummary: document.getElementById("submitScoreSummary"),
      submitScoreStatus: document.getElementById("submitScoreStatus"),
      cancelSubmitScore: document.getElementById("cancelSubmitScore"),
      confirmSubmitScore: document.getElementById("confirmSubmitScore"),
      teamNameInput: document.getElementById("teamName"),
      themeMusicEnabled: document.getElementById("themeMusicEnabled"),
      themeMusic: document.getElementById("themeMusic"),
      openLeaderboard: document.getElementById("openLeaderboard"),
      leaderboardOverlay: document.getElementById("leaderboardOverlay"),
      leaderboardFilters: document.getElementById("leaderboardFilters"),
      leaderboardSummary: document.getElementById("leaderboardSummary"),
      leaderboardBody: document.getElementById("leaderboardBody"),
      leaderboardEmpty: document.getElementById("leaderboardEmpty"),
      closeLeaderboard: document.getElementById("closeLeaderboard"),
      dailyDoubleSound: document.getElementById("dailyDoubleSound"),
      overlay: document.getElementById("overlay"),
      clueCard: document.getElementById("clueCard"),
      closeClue: document.getElementById("closeClue"),
      wagerPanel: document.getElementById("wagerPanel"),
      wagerCurrentScore: document.getElementById("wagerCurrentScore"),
      wagerRange: document.getElementById("wagerRange"),
      dailyDoubleWager: document.getElementById("dailyDoubleWager"),
      lockWager: document.getElementById("lockWager"),
      wagerError: document.getElementById("wagerError"),
      trueDailyDouble: document.getElementById("trueDailyDouble"),
      overlayValue: document.getElementById("overlayValue"),
      overlayCategory: document.getElementById("overlayCategory"),
      overlayClue: document.getElementById("overlayClue"),
      overlayResponse: document.getElementById("overlayResponse"),
      markCorrect: document.getElementById("markCorrect"),
      markMissed: document.getElementById("markMissed")
    };

    init();

    async function init() {
      loadTeamName();
      setupThemeMusic();
      setupLeaderboard();
      try {
        setLoadingText("Loading board...");
        const [board] = await Promise.all([
          loadGameData(),
          loadGameRules().catch((error) => {
            console.error("Couldn't load game rules", error);
            trackTelemetryException(error, { operation: "game_rules_load" });
            state.gameRulesUnavailable = true;
            updateSubmitScoreButton();
          })
        ]);

        state.board = board;
        renderBoard();
        renderHeader();
        const unavailableClues = board.clues.filter((clue) => clue.status === "unavailable").length;
        trackTelemetryEvent("board_loaded", {
          episode: board.episodeTitle || "Unknown episode"
        }, {
          availableClues: board.clues.length - unavailableClues,
          unavailableClues
        });
      } catch (error) {
        console.error("Couldn't load latest game", error);
        trackTelemetryException(error, { operation: "board_load" });
        showFailure();
      }
    }

    async function loadGameRules() {
      const response = await fetch(GAME_RULES_URL, { cache: "no-store" });

      if (!response.ok) {
        throw new Error("Game rules returned status " + response.status);
      }

      const rules = await response.json();
      if (!Number.isInteger(rules.maxSubmittedQuestions) || rules.maxSubmittedQuestions < 1) {
        throw new Error("Game rules must define a positive integer maxSubmittedQuestions.");
      }

      state.maxSubmittedQuestions = rules.maxSubmittedQuestions;
      updateSubmitScoreButton();
    }

    function setupThemeMusic() {
      const enabled = localStorage.getItem(THEME_MUSIC_ENABLED_KEY) !== "false";
      els.themeMusicEnabled.checked = enabled;
      localStorage.setItem(THEME_MUSIC_ENABLED_KEY, String(enabled));
      els.themeMusicEnabled.addEventListener("change", updateThemeMusicSetting);

      if (enabled) {
        playThemeMusic();
      }
    }

    function updateThemeMusicSetting() {
      const enabled = els.themeMusicEnabled.checked;
      localStorage.setItem(THEME_MUSIC_ENABLED_KEY, String(enabled));

      if (enabled) {
        playThemeMusic();
        return;
      }

      clearThemeMusicRetry();
      els.themeMusic.pause();
      els.themeMusic.currentTime = 0;
    }

    function playThemeMusic() {
      els.themeMusic.currentTime = 0;
      const playback = els.themeMusic.play();

      if (playback && typeof playback.catch === "function") {
        playback.catch(scheduleThemeMusicRetry);
      }
    }

    function scheduleThemeMusicRetry() {
      if (state.themeMusicRetryPending || !els.themeMusicEnabled.checked) {
        return;
      }

      state.themeMusicRetryPending = true;
      window.addEventListener("click", retryThemeMusic, { once: true });
      window.addEventListener("keydown", retryThemeMusic, { once: true });
    }

    function retryThemeMusic() {
      clearThemeMusicRetry();

      if (els.themeMusicEnabled.checked) {
        playThemeMusic();
      }
    }

    function clearThemeMusicRetry() {
      state.themeMusicRetryPending = false;
      window.removeEventListener("click", retryThemeMusic);
      window.removeEventListener("keydown", retryThemeMusic);
    }

    async function loadGameData() {
      const response = await fetch(GAME_DATA_URL, { cache: "no-store" });

      if (!response.ok) {
        throw new Error("Game data returned status " + response.status);
      }

      const board = await response.json();
      validateBoard(board);
      return board;
    }

    function validateBoard(board) {
      if (!board || !Array.isArray(board.categories) || !Array.isArray(board.clues)) {
        throw new Error("Game data is missing categories or clues.");
      }

      if (!board.categories.length) {
        throw new Error("Game data has no categories.");
      }

      if (!board.clues.length) {
        throw new Error("Game data has no clues.");
      }

      const dailyDoubleMatches = board.clues.filter((clue) =>
        clue.id === board.dailyDoubleClueId && clue.status === "available"
      );

      if (typeof board.dailyDoubleClueId !== "string" || dailyDoubleMatches.length !== 1) {
        throw new Error("Game data must identify exactly one playable Daily Double.");
      }
    }

    function renderBoard() {
      const board = state.board;
      const rows = Math.max(...board.clues.map((clue) => clue.rowIndex)) + 1;

      els.status.hidden = true;
      els.board.hidden = false;
      els.board.style.setProperty("--category-count", board.categories.length);
      els.board.replaceChildren();

      board.categories.forEach((category) => {
        const header = document.createElement("div");
        header.className = "category";
        header.textContent = category.title;
        els.board.append(header);
      });

      for (let rowIndex = 0; rowIndex < rows; rowIndex += 1) {
        board.categories.forEach((category, categoryIndex) => {
          const clue = board.clues.find((item) => item.rowIndex === rowIndex && item.categoryIndex === categoryIndex);
          els.board.append(renderTile(clue));
        });
      }
    }

    function renderTile(clue) {
      const tile = document.createElement("button");
      tile.type = "button";
      tile.className = "tile";

      if (!clue || clue.status === "unavailable") {
        tile.classList.add("unavailable");
        tile.textContent = "N/A";
        tile.disabled = true;
        return tile;
      }

      tile.textContent = clue.value;

      if (clue.outcome) {
        tile.classList.add("used");
        tile.style.setProperty("--outcome-color", clue.outcome === "correct" ? "var(--correct)" : "var(--missed)");

        if (clue.id === state.board.dailyDoubleClueId) {
          tile.classList.add("daily-double-used");
          tile.textContent = "DD\n" + formatSignedCurrency(clue.dailyDoubleAmount);
        }

        tile.disabled = true;
        return tile;
      }

      tile.addEventListener("click", () => openClue(clue.id, tile));
      return tile;
    }

    function renderHeader() {
      const summary = getScoreSummary();

      els.correctCount.textContent = String(summary.correct);
      els.missedCount.textContent = String(summary.missed);
      els.netValue.textContent = formatCurrency(summary.net);
      els.unavailableCount.textContent = String(summary.unavailable);
      els.episodeMeta.textContent = state.board.episodeTitle;

      els.sourceLink.href = state.board.episodeUrl;
      els.sourceLink.hidden = false;
      updateSubmitScoreButton();
    }

    function getScoreSummary() {
      const board = state.board;
      if (!board) {
        return { correct: 0, missed: 0, net: 0, unavailable: 0, dailyDoubleAmount: 0 };
      }

      const availableClues = board.clues.filter((clue) => clue.status === "available");
      return {
        ...summarizeClues(availableClues),
        unavailable: board.clues.filter((clue) => clue.status === "unavailable").length
      };
    }

    function getSubmissionScoreSummary() {
      const maximum = state.maxSubmittedQuestions || 0;
      const includedClues = state.answeredClueIds
        .slice(0, maximum)
        .map(findClue)
        .filter(Boolean);

      return {
        ...summarizeClues(includedClues),
        questionCount: includedClues.length,
        excludedCount: Math.max(0, state.answeredClueIds.length - includedClues.length)
      };
    }

    function summarizeClues(clues) {
      const correct = clues.filter((clue) => clue.outcome === "correct");
      const missed = clues.filter((clue) => clue.outcome === "missed");
      const net = clues.reduce((sum, clue) => sum + getClueScoreDelta(clue), 0);
      const dailyDouble = clues.find((clue) => clue.id === state.board.dailyDoubleClueId);

      return {
        correct: correct.length,
        missed: missed.length,
        net,
        dailyDoubleAmount: Number(dailyDouble && dailyDouble.dailyDoubleAmount) || 0
      };
    }

    function getClueScoreDelta(clue) {
      if (!clue.outcome) {
        return 0;
      }

      if (Number.isFinite(clue.scoreDelta)) {
        return clue.scoreDelta;
      }

      return clue.outcome === "correct" ? clue.numericValue : -clue.numericValue;
    }

    function openClue(clueId, sourceTile) {
      const clue = findClue(clueId);

      if (!clue || clue.status !== "available" || clue.outcome) {
        return;
      }

      state.selectedClueId = clue.id;
      state.revealed = false;
      state.wagerLocked = false;
      state.selectedTileRect = sourceTile ? sourceTile.getBoundingClientRect() : null;
      const isDailyDouble = clue.id === state.board.dailyDoubleClueId;
      const category = state.board.categories.find((boardCategory) => boardCategory.id === clue.categoryId);
      els.clueCard.classList.toggle("daily-double", isDailyDouble);
      els.clueCard.classList.toggle("wagering", isDailyDouble);
      els.closeClue.hidden = isDailyDouble;
      els.wagerPanel.hidden = true;
      els.trueDailyDouble.hidden = true;
      els.overlayValue.textContent = clue.value;
      els.overlayCategory.textContent = category ? category.title : "Category";
      els.overlayClue.textContent = clue.clueText;
      els.overlayResponse.textContent = clue.response;
      els.clueCard.classList.remove("revealed");

      if (isDailyDouble) {
        prepareDailyDoubleWager();
        playDailyDoubleSound();
      }

      els.overlay.hidden = false;
      els.overlay.classList.add("active");
      document.body.classList.add("overlay-open");
      animateClueOpen(isDailyDouble);
    }

    function playDailyDoubleSound() {
      els.dailyDoubleSound.currentTime = 0;
      const playback = els.dailyDoubleSound.play();

      if (playback && typeof playback.catch === "function") {
        playback.catch((error) => {
          console.warn("Couldn't play the Daily Double sound", error);
        });
      }
    }

    function prepareDailyDoubleWager() {
      const currentScore = getScoreSummary().net;
      const maximumWager = Math.max(currentScore, 1000);
      const defaultWager = currentScore >= 5 ? currentScore : 5;

      state.dailyDoubleScoreBeforeWager = currentScore;
      state.dailyDoubleWager = 0;
      els.dailyDoubleWager.min = "5";
      els.dailyDoubleWager.max = String(maximumWager);
      els.dailyDoubleWager.value = String(defaultWager);
      els.wagerCurrentScore.textContent = "Current score: " + formatCurrency(currentScore);
      els.wagerRange.textContent = "Wager $5–" + formatCurrency(maximumWager);
      els.wagerError.textContent = "";
    }

    function lockDailyDoubleWager() {
      if (!state.selectedClueId || state.wagerLocked) {
        return;
      }

      const clue = findClue(state.selectedClueId);
      if (!clue || clue.id !== state.board.dailyDoubleClueId) {
        return;
      }

      const wager = Number(els.dailyDoubleWager.value);
      const minimumWager = Number(els.dailyDoubleWager.min);
      const maximumWager = Number(els.dailyDoubleWager.max);

      if (!Number.isInteger(wager) || wager < minimumWager || wager > maximumWager) {
        els.wagerError.textContent = "Enter a whole-dollar wager from " +
          formatCurrency(minimumWager) + " to " + formatCurrency(maximumWager) + ".";
        return;
      }

      state.dailyDoubleWager = wager;
      state.wagerLocked = true;
      els.wagerPanel.hidden = true;
      els.clueCard.classList.remove("wagering");
      els.overlayValue.textContent = "Wager: " + formatCurrency(wager);
      els.trueDailyDouble.hidden = !(state.dailyDoubleScoreBeforeWager > 0 &&
        wager === state.dailyDoubleScoreBeforeWager);
    }

    function animateClueOpen(isDailyDouble) {
      if (isDailyDouble) {
        animateDailyDoubleOpen();
        return;
      }

      const sourceRect = state.selectedTileRect;

      if (!sourceRect) {
        return;
      }

      const geometry = getClueTransitionGeometry(sourceRect);

      state.isTransitioning = true;
      els.closeClue.disabled = true;
      els.overlay.classList.add("animating");
      els.clueCard.style.transform = getClueTransitionTransform(geometry);

      requestAnimationFrame(() => {
        requestAnimationFrame(() => {
          els.overlay.style.background = "rgba(2, 4, 18, 0.94)";
          els.clueCard.style.transform = "translate(0, 0) scale(1, 1)";
        });
      });

      window.setTimeout(() => {
        els.overlay.classList.remove("animating");
        els.overlay.style.background = "";
        els.clueCard.style.transform = "";
        state.isTransitioning = false;
        els.closeClue.disabled = false;
      }, 300);
    }

    function animateDailyDoubleOpen() {
      const sourceRect = state.selectedTileRect;
      const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

      if (reduceMotion) {
        animateReducedMotionDailyDoubleOpen();
        return;
      }

      if (!sourceRect) {
        els.wagerPanel.hidden = false;
        els.dailyDoubleWager.focus();
        return;
      }

      const geometry = getClueTransitionGeometry(sourceRect);
      const startTransform = getClueTransitionTransform(geometry, " rotateX(-1800deg)");
      const endTransform = "translate(0, 0) scale(1, 1) rotateX(0deg)";

      state.isTransitioning = true;
      els.overlay.classList.add("daily-double-entering");
      els.clueCard.style.transform = startTransform;

      const animation = els.clueCard.animate([
        { transform: startTransform },
        { transform: endTransform }
      ], {
        duration: 1200,
        easing: "cubic-bezier(0.2, 0.75, 0.2, 1)",
        fill: "forwards"
      });

      requestAnimationFrame(() => {
        els.overlay.style.background = "rgba(2, 4, 18, 0.94)";
      });

      animation.addEventListener("finish", () => {
        animation.cancel();
        els.overlay.classList.remove("daily-double-entering");
        els.overlay.style.background = "";
        els.clueCard.style.transform = "";
        state.isTransitioning = false;
        els.wagerPanel.hidden = false;
        els.dailyDoubleWager.focus();
      }, { once: true });
    }

    function animateReducedMotionDailyDoubleOpen() {
      state.isTransitioning = true;
      els.overlay.classList.add("reduced-motion-entering");

      const animation = els.clueCard.animate([
        { opacity: 0, transform: "scale(0.98)" },
        { opacity: 1, transform: "scale(1)" }
      ], {
        duration: 240,
        easing: "ease-out",
        fill: "forwards"
      });

      animation.addEventListener("finish", () => {
        animation.cancel();
        els.overlay.classList.remove("reduced-motion-entering");
        state.isTransitioning = false;
        els.wagerPanel.hidden = false;
        els.dailyDoubleWager.focus();
      }, { once: true });
    }

    function animateClueClose(afterClose) {
      const sourceRect = state.selectedTileRect;

      if (!sourceRect) {
        finishClose(afterClose);
        return;
      }

      const geometry = getClueTransitionGeometry(sourceRect);

      state.isTransitioning = true;
      els.overlay.classList.add("closing");
      els.overlay.style.background = "rgba(2, 4, 18, 0)";
      els.clueCard.style.transform = getClueTransitionTransform(geometry);

      window.setTimeout(() => {
        finishClose(afterClose);
      }, 260);
    }

    function getClueTransitionGeometry(sourceRect) {
      const targetRect = els.clueCard.getBoundingClientRect();

      return {
        scaleX: sourceRect.width / targetRect.width,
        scaleY: sourceRect.height / targetRect.height,
        translateX: sourceRect.left - targetRect.left,
        translateY: sourceRect.top - targetRect.top
      };
    }

    function getClueTransitionTransform(geometry, suffix = "") {
      return "translate(" + geometry.translateX + "px, " + geometry.translateY + "px) " +
        "scale(" + geometry.scaleX + ", " + geometry.scaleY + ")" + suffix;
    }

    function revealClue() {
      if (!state.selectedClueId || state.revealed || state.isTransitioning) {
        return;
      }

      const clue = findClue(state.selectedClueId);
      if (clue && clue.id === state.board.dailyDoubleClueId && !state.wagerLocked) {
        return;
      }

      state.revealed = true;
      els.clueCard.classList.add("revealed");
    }

    function closeClue(afterClose) {
      state.selectedClueId = null;
      state.revealed = false;
      state.selectedTileRect = null;
      state.isTransitioning = false;
      els.closeClue.disabled = false;
      els.overlay.classList.remove("animating", "closing");
      els.overlay.classList.remove("daily-double-entering", "reduced-motion-entering");
      els.overlay.style.background = "";
      els.clueCard.style.transform = "";
      els.overlay.classList.remove("active");
      els.overlay.hidden = true;
      document.body.classList.remove("overlay-open");

      if (typeof afterClose === "function") {
        afterClose();
      }
    }

    function finishClose(afterClose) {
      closeClue(afterClose);
    }

    function markOutcome(outcome) {
      if (!state.selectedClueId || !state.revealed || state.isTransitioning) {
        return;
      }

      const clue = findClue(state.selectedClueId);
      if (!clue || clue.outcome) {
        return;
      }

      clue.outcome = outcome;

      if (clue.id === state.board.dailyDoubleClueId) {
        clue.dailyDoubleAmount = outcome === "correct" ? state.dailyDoubleWager : -state.dailyDoubleWager;
        clue.scoreDelta = clue.dailyDoubleAmount;
      }

      state.answeredClueIds.push(clue.id);
      const isDailyDouble = clue.id === state.board.dailyDoubleClueId;
      trackTelemetryEvent("clue_answered", {
        outcome,
        dailyDouble: String(isDailyDouble)
      }, {
        scoreDelta: getClueScoreDelta(clue),
        answeredClues: state.answeredClueIds.length
      });

      animateClueClose(() => {
        renderBoard();
        renderHeader();
      });
    }

    function findClue(clueId) {
      return state.board.clues.find((clue) => clue.id === clueId);
    }

    function formatCurrency(value) {
      const prefix = value < 0 ? "-$" : "$";
      return prefix + Math.abs(value).toLocaleString("en-US");
    }

    function formatSignedCurrency(value) {
      if (value > 0) {
        return "+" + formatCurrency(value);
      }

      return formatCurrency(value);
    }

    function trackTelemetryEvent(name, properties = {}, measurements = {}) {
      window.jeopardyTelemetry?.trackEvent(name, properties, measurements);
    }

    function trackTelemetryException(error, properties = {}) {
      window.jeopardyTelemetry?.trackException(error, properties);
    }

    function setLoadingText(text) {
      els.statusTitle.textContent = text;
    }

    function showFailure() {
      els.status.hidden = false;
      els.board.hidden = true;
      els.status.innerHTML = "<div><p class=\"status-title\">Couldn't load latest game</p></div>";
    }

    function setupScoreSubmission() {
      if (!els.submitScore || !els.submitScoreOverlay || !els.cancelSubmitScore || !els.confirmSubmitScore) {
        return;
      }

      els.submitScore.addEventListener("click", openSubmitScoreModal);
      els.cancelSubmitScore.addEventListener("click", closeSubmitScoreModal);
      els.confirmSubmitScore.addEventListener("click", () => submitScore().catch(console.error));
      updateSubmitScoreButton();
    }

    function updateSubmitScoreButton() {
      if (!els.submitScore) {
        return;
      }

      const summary = getSubmissionScoreSummary();

      if (state.scoreSubmitted) {
        els.submitScore.disabled = true;
        els.submitScore.textContent = "Submitted";
      } else if (state.scoreSubmitting) {
        els.submitScore.disabled = true;
        els.submitScore.textContent = "Submitting...";
      } else if (state.gameRulesUnavailable) {
        els.submitScore.disabled = true;
        els.submitScore.textContent = "Score submission unavailable";
      } else if (!state.maxSubmittedQuestions) {
        els.submitScore.disabled = true;
        els.submitScore.textContent = "Loading score rules...";
      } else if (!summary.questionCount) {
        els.submitScore.disabled = true;
        els.submitScore.textContent = "Answer a question to submit";
      } else {
        els.submitScore.disabled = false;
        els.submitScore.textContent = "Submit score for first " + summary.questionCount + " " +
          (summary.questionCount === 1 ? "question" : "questions");
      }
    }

    function openSubmitScoreModal() {
      const summary = getSubmissionScoreSummary();
      if (state.scoreSubmitted || state.scoreSubmitting || !state.maxSubmittedQuestions || !summary.questionCount) {
        return;
      }

      const teamName = getTeamName();
      const questionLabel = "First " + summary.questionCount + " " +
        (summary.questionCount === 1 ? "question" : "questions");
      const excludedText = summary.excludedCount
        ? " · " + summary.excludedCount + " later " +
          (summary.excludedCount === 1 ? "answer is" : "answers are") + " not included."
        : "";
      els.submitScoreSummary.textContent = `${teamName || "Unnamed team"}: ${questionLabel}: ` +
        `${formatCurrency(summary.net)} ` +
        `(${summary.correct} correct, ${summary.missed} missed) · DD Amount: ` +
        formatSignedCurrency(summary.dailyDoubleAmount) + excludedText;
      els.submitScoreStatus.textContent = teamName ? "" : "Enter a team name before submitting.";
      els.confirmSubmitScore.disabled = !teamName;
      els.submitScoreOverlay.hidden = false;
      els.submitScoreOverlay.classList.add("active");
      document.body.classList.add("overlay-open");
    }

    function closeSubmitScoreModal() {
      if (state.scoreSubmitting) {
        return;
      }

      els.submitScoreOverlay.hidden = true;
      els.submitScoreOverlay.classList.remove("active");
      document.body.classList.remove("overlay-open");
    }

    function getTeamName() {
      return els.teamNameInput ? els.teamNameInput.value.trim() : "";
    }

    async function submitScore() {
      const summary = getSubmissionScoreSummary();
      if (state.scoreSubmitted || state.scoreSubmitting || !state.maxSubmittedQuestions || !summary.questionCount) {
        return;
      }

      const teamName = getTeamName();
      if (!teamName) {
        els.submitScoreStatus.textContent = "Enter a team name before submitting.";
        els.confirmSubmitScore.disabled = true;
        return;
      }

      state.scoreSubmitting = true;
      els.confirmSubmitScore.disabled = true;
      els.cancelSubmitScore.disabled = true;
      els.submitScoreStatus.textContent = "Submitting score...";
      updateSubmitScoreButton();

      try {
        await postScore({
          teamName,
          net: summary.net,
          correct: summary.correct,
          missed: summary.missed,
          daily_double_amount: summary.dailyDoubleAmount,
          sourceEpisode: state.board ? state.board.episodeTitle : "",
          sourceUrl: state.board ? state.board.episodeUrl : ""
        });
      } catch (error) {
        console.error(error);
        trackTelemetryException(error, { operation: "score_submission" });
        state.scoreSubmitting = false;
        els.confirmSubmitScore.disabled = false;
        els.cancelSubmitScore.disabled = false;
        els.submitScoreStatus.textContent = "Unable to submit score. Try again.";
        updateSubmitScoreButton();
        return;
      }

      trackTelemetryEvent("score_submitted", {}, {
        net: summary.net,
        correct: summary.correct,
        missed: summary.missed,
        dailyDoubleAmount: summary.dailyDoubleAmount,
        questionCount: summary.questionCount
      });
      state.scoreSubmitting = false;
      state.scoreSubmitted = true;
      els.cancelSubmitScore.disabled = false;
      updateSubmitScoreButton();
      closeSubmitScoreModal();
    }

    async function postScore(score) {
      const response = await fetch(SUBMIT_SCORE_API_URL, {
        method: "POST",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(score)
      });

      if (!response.ok) {
        throw new Error("Score submission failed: " + response.status);
      }

      return response.json();
    }

    function setupLeaderboard() {
      if (!els.leaderboardFilters || !els.openLeaderboard || !els.closeLeaderboard) {
        return;
      }

      LEADERBOARD_FILTERS.forEach((filter) => {
        const button = document.createElement("button");
        button.type = "button";
        button.className = "filter-button";
        button.dataset.filter = filter.id;
        button.textContent = filter.label;
        button.addEventListener("click", () => selectLeaderboardFilter(filter.id));
        els.leaderboardFilters.append(button);
      });

      els.openLeaderboard.addEventListener("click", () => openLeaderboard().catch(console.error));
      els.closeLeaderboard.addEventListener("click", closeLeaderboardPanel);
      selectLeaderboardFilter(state.leaderboardFilter).catch(console.error);
    }

    async function openLeaderboard() {
      await renderLeaderboard();
      els.leaderboardOverlay.hidden = false;
      els.leaderboardOverlay.classList.add("active");
      document.body.classList.add("overlay-open");
    }

    function closeLeaderboardPanel() {
      els.leaderboardOverlay.hidden = true;
      els.leaderboardOverlay.classList.remove("active");
      document.body.classList.remove("overlay-open");
    }

    async function selectLeaderboardFilter(filterId) {
      state.leaderboardFilter = filterId;
      const buttons = els.leaderboardFilters.querySelectorAll(".filter-button");
      buttons.forEach((button) => {
        button.classList.toggle("active", button.dataset.filter === filterId);
      });
      await renderLeaderboard();
    }

    async function fetchLeaderboardScores(filterId) {
      const url = new URL(LEADERBOARD_API_URL, window.location.origin);
      url.searchParams.set("filter", filterId);

      const response = await fetch(url.toString(), { cache: "no-store" });
      if (!response.ok) {
        throw new Error("Leaderboard fetch failed: " + response.status);
      }

      const payload = await response.json();
      return payload.scores || [];
    }

    async function renderLeaderboard() {
      els.leaderboardSummary.textContent = "Loading leaderboard...";
      els.leaderboardBody.replaceChildren();
      els.leaderboardEmpty.hidden = true;

      let scores;
      try {
        scores = await fetchLeaderboardScores(state.leaderboardFilter);
      } catch (error) {
        console.error(error);
        els.leaderboardSummary.textContent = "Unable to load leaderboard.";
        els.leaderboardEmpty.hidden = false;
        return;
      }

      els.leaderboardSummary.textContent = `Showing ${scores.length} teams for ${LEADERBOARD_FILTERS.find((filter) => filter.id === state.leaderboardFilter).label}.`;
      els.leaderboardBody.replaceChildren();
      els.leaderboardEmpty.hidden = scores.length > 0;

      if (!scores.length) {
        return;
      }

      scores.forEach((row) => {
        const tr = document.createElement("tr");

        const teamCell = document.createElement("td");
        teamCell.textContent = row.teamName;
        tr.append(teamCell);

        const scoreCell = document.createElement("td");
        scoreCell.textContent = formatCurrency(row.score);
        tr.append(scoreCell);

        const dailyDoubleCell = document.createElement("td");
        dailyDoubleCell.textContent = formatSignedCurrency(Number(row.daily_double_amount) || 0);
        tr.append(dailyDoubleCell);

        const correctCell = document.createElement("td");
        correctCell.textContent = String(row.correct);
        tr.append(correctCell);

        const missedCell = document.createElement("td");
        missedCell.textContent = String(row.missed);
        tr.append(missedCell);

        const gamesCell = document.createElement("td");
        gamesCell.textContent = String(row.games);
        tr.append(gamesCell);

        els.leaderboardBody.append(tr);
      });
    }

    function loadTeamName() {
      if (!els.teamNameInput) {
        return;
      }

      const savedTeamName = localStorage.getItem(TEAM_NAME_KEY);
      if (savedTeamName !== null) {
        els.teamNameInput.value = savedTeamName;
      }
    }

    function saveTeamName() {
      if (!els.teamNameInput) {
        return;
      }

      const teamName = els.teamNameInput.value;
      if (teamName === "") {
        localStorage.removeItem(TEAM_NAME_KEY);
      } else {
        localStorage.setItem(TEAM_NAME_KEY, teamName);
      }
    }

    els.teamNameInput.addEventListener("input", saveTeamName);
    setupScoreSubmission();

    els.clueCard.addEventListener("click", (event) => {
      if (event.target.closest("button")) {
        return;
      }

      revealClue();
    });

    els.closeClue.addEventListener("click", () => {
      if (!state.isTransitioning) {
        const teamName = getTeamName();
        const properties = teamName ? { teamName } : {};
        if (!state.revealed) {
          trackTelemetryEvent("clue_abandoned", properties);
        } else {
          trackTelemetryEvent("clue_cheated", properties);
        }
        animateClueClose();
      }
    });
    els.lockWager.addEventListener("click", lockDailyDoubleWager);
    els.dailyDoubleWager.addEventListener("keydown", (event) => {
      if (event.key === "Enter") {
        lockDailyDoubleWager();
      }
    });
    els.markCorrect.addEventListener("click", () => markOutcome("correct"));
    els.markMissed.addEventListener("click", () => markOutcome("missed"));
  </script>
</body>

</html>
